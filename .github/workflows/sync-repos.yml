name: Sync Subfolders to Separate Repos

on:
  push:
    branches:
      - dev

jobs:
  sync-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo APP_PADi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wajib 0 agar seluruh riwayat terbawa
          token: ${{ secrets.GH_PAT }}

      - name: Push Frontend with History
        run: |
          # 1. Memisahkan riwayat khusus folder frontend ke branch sementara
          git subtree split --prefix=platform_absensi_digital -b split-frontend

          # 2. Push riwayat asli ke repo Frontend_PADi
          git push https://${{ secrets.GH_PAT }}@github.com/PADi-bang/Frontend_PADi.git split-frontend:dev --force

  sync-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo APP_PADi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Push Backend with History
        run: |
          # 1. Memisahkan riwayat khusus folder backend ke branch sementara
          git subtree split --prefix=backend -b split-backend

          # 2. Push riwayat asli ke repo Backend_PADi
          git push https://${{ secrets.GH_PAT }}@github.com/PADi-bang/Backend_PADi.git split-backend:dev --force
